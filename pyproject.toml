[project]
name = "ccstytr"
version = "0.1.0"
description = "CC-StyTr: Structure-aware style transfer with residual saliency gating and spatial alpha control"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["ccstytr*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["_archive_before_cleanup_round2"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["ccstytr"]
